<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-white text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Series | Premium Tech Pen</title>
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Lucide via Iconify) -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="selection:bg-black/10 selection:text-black">
    
    <!-- Global Noise Texture (Subtle Grain) -->
    <div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.025] mix-blend-multiply" style='background-image: url("data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E");'></div>

    {{> loading-screen }}
    {{> side-nav }}
    {{> navbar }}

    <div class="main-content">
        {{> hero }}
        {{> technical-architecture }}
        {{> inside-precision }}
        {{> impact-statement }}
    </div>

    <!-- Scripts -->
    <script type="module" src="./main.js"></script>
</body>
</html>
