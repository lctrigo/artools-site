<!-- Loading Screen (Micro-minimalist) -->

    <div class="font-mono text-xs text-slate-400 tracking-[0.2em] mb-4 uppercase animate-pulse">Syncing Precision...</div>
    <div class="w-48 h-[1px] bg-slate-200 relative overflow-hidden">
        <div id="loading-bar" class="absolute top-0 left-0 h-full bg-slate-800 w-0 transition-all duration-300"></div>
    </div>
</div>
